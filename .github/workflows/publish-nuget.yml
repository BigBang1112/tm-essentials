name: Publish NuGet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      description:
        description: Text before the release notes
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads the packages to it
      packages: write # publishes to GitHub Packages
      id-token: write # NuGet.org trusted publishing
    concurrency:
      group: publish-nuget-${{ github.ref }}
    steps:
      - uses: bigbang1112/workflows/publish-nuget-immutable@main
        with:
          dotnet-version: latest
          project-path: Src/*/*.csproj
          test-path: |
            Tests/TmEssentials.Tests/TmEssentials.Tests.csproj
            Tests/TmEssentials.Razor.Tests/TmEssentials.Razor.Tests.csproj
          main-project: TmEssentials
          release-description: ${{ inputs.description }}
          nuget-user: ${{ vars.NUGET_USER }}
          release-all-packages: true
